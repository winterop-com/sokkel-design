name: pages

# The documentation site: scripts/site.ts builds _site/ from the contract's files, and GitHub Pages
# serves it at https://winterop-com.github.io/sokkel-design/.
on:
    workflow_dispatch:
    push:
        branches: [main]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - run: npm install -g bun@1.4.4
            - run: bun scripts/site.ts
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: _site
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
